<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c25"/>
      <stop offset="1" stop-color="#08080b"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ef0f7"/>
      <stop offset="0.5" stop-color="#19c3d6"/>
      <stop offset="1" stop-color="#8b6cff"/>
    </linearGradient>
    <radialGradient id="luce" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6cc" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6cc"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Il sigillo semplificato, per le misure piccole (barra dell'app, barra
       delle applicazioni, sito): l'anello più spesso, le gemme e la stella più
       grandi, senza le rune sottili. -->
  <rect id="forma" width="128" height="128" rx="28" fill="url(#fondo)"/>
  <circle cx="64" cy="64" r="43" fill="none" stroke="url(#aurora)" stroke-width="8"/>
  <g fill="url(#aurora)">
    <rect x="57" y="12" width="14" height="14" rx="2" transform="rotate(45 64 19)"/>
    <rect x="57" y="102" width="14" height="14" rx="2" transform="rotate(45 64 109)"/>
    <rect x="12" y="57" width="14" height="14" rx="2" transform="rotate(45 19 64)"/>
    <rect x="102" y="57" width="14" height="14" rx="2" transform="rotate(45 109 64)"/>
  </g>
  <circle cx="64" cy="64" r="30" fill="url(#luce)"/>
  <path d="M0,-6 C0.8,-1.5 1.5,-0.8 6,0 C1.5,0.8 0.8,1.5 0,6 C-0.8,1.5 -1.5,0.8 -6,0 C-1.5,-0.8 -0.8,-1.5 0,-6 Z" fill="url(#oro)" transform="translate(64 64) scale(4.1)"/>
