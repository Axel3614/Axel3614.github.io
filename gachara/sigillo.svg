<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c25"/>
      <stop offset="1" stop-color="#08080b"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ef0f7"/>
      <stop offset="0.5" stop-color="#19c3d6"/>
      <stop offset="1" stop-color="#8b6cff"/>
    </linearGradient>
    <radialGradient id="luce" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6cc" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pozzo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#19c3d6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b6cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6cc"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Il sigillo di Gachara (1.0, scelto dall'utente il 2026-10-21: "cosi il cerchio è molto più carino"): il cerchio di un'evocazione, con l'anello di rune nei colori dell'app (aurora, dal turchese al viola), quattro gemme ai punti cardinali e la stella d'oro della carta rara che brilla al centro. -->
  
  <circle cx="64" cy="64" r="50" fill="url(#pozzo)"/>
  <circle cx="64" cy="64" r="46" fill="none" stroke="url(#aurora)" stroke-width="4"/>
  <circle cx="64" cy="64" r="39.5" fill="none" stroke="url(#aurora)" stroke-width="3" stroke-dasharray="2 3.2 8 3.2" opacity="0.85"/>
  <circle cx="64" cy="64" r="32" fill="none" stroke="#a78bfa" stroke-width="1.2" opacity="0.7"/>
  <g fill="url(#aurora)">
    <rect x="59" y="13" width="10" height="10" rx="1.5" transform="rotate(45 64 18)"/>
    <rect x="59" y="105" width="10" height="10" rx="1.5" transform="rotate(45 64 110)"/>
    <rect x="13" y="59" width="10" height="10" rx="1.5" transform="rotate(45 18 64)"/>
    <rect x="105" y="59" width="10" height="10" rx="1.5" transform="rotate(45 110 64)"/>
  </g>
  <circle cx="64" cy="64" r="28" fill="url(#luce)"/>
  <path d="M0,-6 C0.8,-1.5 1.5,-0.8 6,0 C1.5,0.8 0.8,1.5 0,6 C-0.8,1.5 -1.5,0.8 -6,0 C-1.5,-0.8 -0.8,-1.5 0,-6 Z" fill="url(#oro)" transform="translate(64 64) scale(3.6)"/>
</svg>
